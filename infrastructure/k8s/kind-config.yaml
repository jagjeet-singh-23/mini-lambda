kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080 # Exposes node port for Gateway
        hostPort: 8080
        protocol: TCP
      - containerPort: 30000 # Exposes node port for Grafana
        hostPort: 3000
        protocol: TCP
