apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: mini-lambda
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15.5-alpine
          env:
            - name: POSTGRES_DB
              value: "mini_lambda"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mini-lambda-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mini-lambda-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mini-lambda
spec:
  ports:
    - port: 5432
  selector:
    app: postgres
