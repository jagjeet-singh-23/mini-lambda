apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-ratelimit
  namespace: mini-lambda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-ratelimit
  template:
    metadata:
      labels:
        app: redis-ratelimit
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-ratelimit
  namespace: mini-lambda
spec:
  type: NodePort
  ports:
    - port: 6379
      nodePort: 30380
  selector:
    app: redis-ratelimit
