apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lambda-executor-role
  namespace: mini-lambda
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec"]
    verbs: ["create", "get", "watch", "list", "delete", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lambda-executor-binding
  namespace: mini-lambda
subjects:
  - kind: ServiceAccount
    name: lambda-service
roleRef:
  kind: Role
  name: lambda-executor-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lambda-service
  namespace: mini-lambda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lambda-service
  template:
    metadata:
      labels:
        app: lambda-service
    spec:
      enableServiceLinks: false
      serviceAccountName: lambda-service
      containers:
        - name: lambda-service
          image: ghcr.io/${GITHUB_USER}/lambda-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: mini-lambda-config
          env:
            - name: SERVICE_NAME
              value: "lambda-service"
            - name: KUBERNETES_SERVICE_HOST
              value: "kubernetes.default.svc"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: lambda-service
  namespace: mini-lambda
spec:
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: lambda-service
