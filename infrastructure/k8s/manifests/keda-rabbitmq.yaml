apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: build-worker-scaler
  namespace: mini-lambda
spec:
  scaleTargetRef:
    name: build-worker
  pollingInterval: 5
  cooldownPeriod: 30
  idleReplicaCount: 0
  minReplicaCount: 1
  maxReplicaCount: 50
  triggers:
  - type: rabbitmq
    metadata:
      hostFromEnv: RABBITMQ_URL
      queueName: build-jobs
      mode: QueueLength
      value: "5"
