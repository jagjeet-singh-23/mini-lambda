name: CD

on:
  push:
    branches:
      - stage

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        metadata:
          - service: gateway
            context: .
            dockerfile: services/gateway/Dockerfile
            image: gateway
          - service: build-master
            context: .
            dockerfile: services/build-service/Dockerfile.master
            image: build-master
          - service: build-worker
            context: .
            dockerfile: services/build-service/Dockerfile.worker
            image: build-worker
          - service: lambda-service
            context: .
            dockerfile: services/lambda-service/Dockerfile
            image: lambda-service
          - service: lambda-runner-python
            context: .
            dockerfile: infrastructure/docker/runners/python-runner.Dockerfile
            image: lambda-runner-python
          - service: lambda-runner-node
            context: .
            dockerfile: infrastructure/docker/runners/node-runner.Dockerfile
            image: lambda-runner-node
          - service: db-migrator
            context: .
            dockerfile: infrastructure/docker/db-migrator.Dockerfile
            image: db-migrator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/${{ matrix.metadata.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.metadata.context }}
          file: ${{ matrix.metadata.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          cd ~/apps/mini-lambda
          git fetch origin
          git checkout stage
          git pull origin stage
          # Ensure Kind cluster exists (we check if kubectl can reach it)
          if ! kubectl cluster-info --context kind-kind > /dev/null 2>&1; then
            kind create cluster --config infrastructure/k8s/kind-config.yaml
          fi

          export GITHUB_USER=${{ github.repository_owner }}
          # Apply manifest folder
          kubectl apply -f infrastructure/k8s/manifests/namespace.yaml
          
          envsubst < infrastructure/k8s/manifests/build-master.yaml | kubectl apply -f -
          envsubst < infrastructure/k8s/manifests/build-worker.yaml | kubectl apply -f -
          envsubst < infrastructure/k8s/manifests/gateway.yaml | kubectl apply -f -
          envsubst < infrastructure/k8s/manifests/lambda-service.yaml | kubectl apply -f -
          
          # Delete any previous migration job to ensure it runs on every deploy
          kubectl delete job db-migrator-job -n mini-lambda --ignore-not-found
          envsubst < infrastructure/k8s/manifests/db-migrator.yaml | kubectl apply -f -
          
          kubectl apply -f infrastructure/k8s/manifests/configmap.yaml
          kubectl apply -f infrastructure/k8s/manifests/secrets.yaml
          kubectl apply -f infrastructure/k8s/manifests/postgres.yaml
          kubectl apply -f infrastructure/k8s/manifests/rabbitmq.yaml
          kubectl apply -f infrastructure/k8s/manifests/redis.yaml
          kubectl apply -f infrastructure/k8s/manifests/minio.yaml
          kubectl apply -f infrastructure/k8s/manifests/observability/

          # Always rollout restart the application deployments to pull latest if tags didn't change
          kubectl rollout restart deployment gateway build-master build-worker lambda-service -n mini-lambda

          docker image prune -f