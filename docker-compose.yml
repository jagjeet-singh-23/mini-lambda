# docker-compose.observability.yml
version: '3.9'

networks:
  mini-lambda:
    driver: bridge

volumes:
  postgres-data:
  redis-cache-data:
  minio-data:
  rabbitmq-data:
  prometheus-data:
  loki-data:
  grafana-data:

services:
  # ==========================================
  # Infrastructure Services
  # ==========================================
  
  postgres:
    image: postgres:15-alpine
    container_name: mini-lambda-postgres
    environment:
      POSTGRES_DB: mini_lambda
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mini-lambda
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mini_lambda"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:7.2-alpine
    container_name: mini-lambda-redis-cache
    restart: unless-stopped
    volumes:
      - redis-cache-data:/data
    ports:
      - "6379:6379"
    networks:
      - mini-lambda
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: mini-lambda-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - mini-lambda

  minio:
    image: minio/minio:latest
    container_name: mini-lambda-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - mini-lambda
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  db-migrator:
    image: migrate/migrate:v4.16.2
    container_name: mini-lambda-db-migrator
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://postgres:postgres@postgres:5432/mini_lambda?sslmode=disable
      - up
    networks:
      - mini-lambda
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # Application Services with Logging
  # ==========================================

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    image: ghcr.io/${GITHUB_USER}/gateway:latest
    container_name: mini-lambda-gateway
    ports:
      - "8080:8080"
    environment:
      SERVICE_NAME: gateway
      LOG_LEVEL: info
      POSTGRES_HOST: postgres
      REDIS_ADDR: redis-cache:6379
      BUILD_SERVICE_URL: http://build-master:8082
      LAMBDA_SERVICE_URL: http://lambda-service:8081
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      redis-cache:
        condition: service_healthy
    networks:
      - mini-lambda
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,environment"
    labels:
      service: "gateway"
      environment: "development"

  build-master:
    build:
      context: .
      dockerfile: services/build-service/Dockerfile.master
    image: ghcr.io/${GITHUB_USER}/build-master:latest
    container_name: mini-lambda-build-master
    ports:
      - "8082:8082"
    environment:
      SERVICE_NAME: build-master
      LOG_LEVEL: info
      POSTGRES_HOST: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    networks:
      - mini-lambda
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      service: "build-master"
      environment: "development"

  build-worker:
    build:
      context: .
      dockerfile: services/build-service/Dockerfile.worker
    image: ghcr.io/${GITHUB_USER}/build-worker:latest
    group_add:
      - "984"
    environment:
      SERVICE_NAME: build-worker
      LOG_LEVEL: info
      POSTGRES_HOST: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      S3_ENDPOINT: http://minio:9000
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mini-lambda
    deploy:
      replicas: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      service: "build-worker"
      environment: "development"

  lambda-service:
    build:
      context: .
      dockerfile: services/lambda-service/Dockerfile
    image: ghcr.io/${GITHUB_USER}/lambda-service:latest
    container_name: mini-lambda-lambda-service
    group_add:
      - "984"
    ports:
      - "8081:8081"
    environment:
      SERVICE_NAME: lambda-service
      LOG_LEVEL: info
      POSTGRES_HOST: postgres
      POSTGRES_DB: mini_lambda
      REDIS_ADDR: redis-cache:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      S3_ENDPOINT: http://minio:9000
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      redis-cache:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - mini-lambda
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      service: "lambda-service"
      environment: "development"

  # ==========================================
  # Observability Stack
  # ==========================================

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: mini-lambda-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - mini-lambda
    restart: unless-stopped

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:2.9.0
    container_name: mini-lambda-loki
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yml
      - ./observability/loki/loki-rules.yml:/etc/loki/rules/fake/rules.yml
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - mini-lambda
    restart: unless-stopped

  # Promtail - Log Shipper (Sidecar Pattern)
  promtail:
    image: grafana/promtail:2.9.0
    container_name: mini-lambda-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mini-lambda
    restart: unless-stopped

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: mini-lambda-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    networks:
      - mini-lambda
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped