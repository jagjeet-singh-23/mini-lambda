groups:
  - name: mini_lambda_recordings
    interval: 30s
    rules:
      # Aggregate HTTP metrics by service
      - record: service:http_requests:rate5m
        expr: rate(http_requests_total[5m])

      - record: service:http_request_duration:p95
        expr: |
          histogram_quantile(0.95, 
            rate(http_request_duration_seconds_bucket[5m])
          )

      - record: service:http_request_duration:p99
        expr: |
          histogram_quantile(0.99, 
            rate(http_request_duration_seconds_bucket[5m])
          )

      # Function metrics aggregations
      - record: function:invocations:rate5m
        expr: rate(function_invocations_total[5m])

      - record: function:execution_duration:p95
        expr: |
          histogram_quantile(0.95, 
            rate(function_execution_duration_seconds_bucket[5m])
          )

      - record: function:error_rate
        expr: |
          rate(function_invocations_total{status="error"}[5m])
          / 
          rate(function_invocations_total[5m])

      - record: function:cold_start_rate
        expr: |
          rate(function_cold_starts_total[5m])
          / 
          rate(function_invocations_total[5m])

      # Build metrics
      - record: build:success_rate
        expr: |
          rate(builds_total{status="success"}[5m])
          / 
          rate(builds_total[5m])

      # Cache hit rate
      - record: cache:hit_rate
        expr: |
          rate(cache_hits_total[5m])
          / 
          (rate(cache_hits_total[5m]) + rate(cache_misses_total[5m]))
