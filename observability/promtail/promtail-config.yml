server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["service"]

    relabel_configs:
      # Extract container name
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"

      # Extract service label
      - source_labels: ["__meta_docker_container_label_service"]
        target_label: "service"

      # Extract environment label
      - source_labels: ["__meta_docker_container_label_environment"]
        target_label: "environment"

      # Container ID
      - source_labels: ["__meta_docker_container_id"]
        target_label: "container_id"
        regex: "(.{12})"

      # Log path
      - source_labels: ["__meta_docker_container_id"]
        target_label: "__path__"
        replacement: "/var/lib/docker/containers/$1/*.log"

    pipeline_stages:
      # Parse JSON logs
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
            request_id: request_id
            function_id: function_id
            duration_ms: duration_ms

      # Extract timestamp
      - timestamp:
          source: timestamp
          format: RFC3339Nano

      # Add labels from log fields
      - labels:
          level:
          service:

      # Output template
      - output:
          source: message

  # Scrape application-specific logs
  - job_name: gateway
    static_configs:
      - targets:
          - localhost
        labels:
          job: gateway
          service: gateway
          __path__: /var/lib/docker/containers/*gateway*.log

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            handler: handler
            method: method
            path: path
            request_id: request_id
            duration_ms: duration_ms

      - timestamp:
          source: timestamp
          format: RFC3339Nano

      - labels:
          level:
          handler:
          method:

      - output:
          source: message

  - job_name: lambda-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: lambda-service
          service: lambda-service
          __path__: /var/lib/docker/containers/*lambda-service*.log

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            function_id: function_id
            function_name: function_name
            invocation_id: invocation_id
            duration_ms: duration_ms
            cold_start: cold_start

      - timestamp:
          source: timestamp
          format: RFC3339Nano

      - labels:
          level:
          function_name:
          cold_start:

      - output:
          source: message

  - job_name: build-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: build-service
          service: build-service
          __path__: /var/lib/docker/containers/*build-*.log

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            runtime: runtime
            function_id: function_id
            build_id: build_id
            phase: phase

      - timestamp:
          source: timestamp
          format: RFC3339Nano

      - labels:
          level:
          runtime:
          phase:

      - output:
          source: message
