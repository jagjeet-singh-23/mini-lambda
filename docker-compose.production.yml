version: '3.9'

networks:
  mini-lambda:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  rabbitmq-data:
  prometheus-data:
  loki-data:
  grafana-data:

services:
  # Infrastructure
  postgres:
    image: postgres:15-alpine
    container_name: mini-lambda-postgres
    restart: always
    environment:
      POSTGRES_DB: mini_lambda
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mini-lambda

  redis:
    image: redis:7-alpine
    container_name: mini-lambda-redis
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - mini-lambda

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: mini-lambda-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - mini-lambda

  minio:
    image: minio/minio:latest
    container_name: mini-lambda-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    networks:
      - mini-lambda

  # Application Services
  gateway:
    image: ghcr.io/${GITHUB_USER}/gateway:latest
    container_name: mini-lambda-gateway
    restart: always
    ports:
      - "80:8080"
    environment:
      SERVICE_NAME: gateway
      LOG_LEVEL: info
      POSTGRES_HOST: postgres
      REDIS_ADDR: redis:6379
      BUILD_SERVICE_URL: http://build-master:8082
      LAMBDA_SERVICE_URL: http://lambda-service:8081
    networks:
      - mini-lambda
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  build-master:
    image: ghcr.io/${GITHUB_USER}/build-master:latest
    container_name: mini-lambda-build-master
    restart: always
    environment:
      SERVICE_NAME: build-master
      LOG_LEVEL: info
      POSTGRES_HOST: postgres
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    networks:
      - mini-lambda
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  build-worker:
    image: ghcr.io/${GITHUB_USER}/build-worker:latest
    restart: always
    environment:
      SERVICE_NAME: build-worker
      LOG_LEVEL: info
      POSTGRES_HOST: postgres
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      S3_ENDPOINT: http://minio:9000
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mini-lambda
    deploy:
      replicas: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  lambda-service:
    image: ghcr.io/${GITHUB_USER}/lambda-service:latest
    container_name: mini-lambda-lambda-service
    restart: always
    environment:
      SERVICE_NAME: lambda-service
      LOG_LEVEL: info
      POSTGRES_HOST: postgres
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: http://minio:9000
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mini-lambda
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Observability
  prometheus:
    image: prom/prometheus:latest
    container_name: mini-lambda-prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - mini-lambda

  loki:
    image: grafana/loki:2.9.0
    container_name: mini-lambda-loki
    restart: always
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yml:ro
      - ./observability/loki/loki-rules.yml:/etc/loki/rules/fake/rules.yml:ro
      - loki-data:/loki
    networks:
      - mini-lambda

  grafana:
    image: grafana/grafana:latest
    container_name: mini-lambda-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASS:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - mini-lambda
    depends_on:
      - prometheus
      - loki
