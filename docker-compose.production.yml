version: '3.9'

networks:
  mini-lambda:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
  loki-data:
  grafana-data:

services:
  redis:
    image: redis:7.2-alpine
    container_name: mini-lambda-redis
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mini-lambda

  db-migrator:
    image: migrate/migrate:v4.16.2
    container_name: mini-lambda-db-migrator
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-mini_lambda}?sslmode=${POSTGRES_SSLMODE:-disable}
      - up
    networks:
      - mini-lambda

  # Application Services
  gateway:
    image: ghcr.io/${GITHUB_USER}/gateway:latest
    container_name: mini-lambda-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      SERVICE_NAME: gateway
      LOG_LEVEL: info
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mini_lambda}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      REDIS_ADDR: redis:6379
      BUILD_SERVICE_URL: http://build-master:8082
      LAMBDA_SERVICE_URL: http://lambda-service:8081
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - mini-lambda
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  build-master:
    image: ghcr.io/${GITHUB_USER}/build-master:latest
    container_name: mini-lambda-build-master
    restart: always
    environment:
      SERVICE_NAME: build-master
      LOG_LEVEL: info
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mini_lambda}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqps://${RABBITMQ_USER}:${RABBITMQ_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT:-5671}/}
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_REGION: "${AWS_REGION:-ap-south-1}"
      S3_BUCKET: "${S3_BUCKET:-mini-lambda-prod}"
      S3_ACCESS_KEY: "${AWS_ACCESS_KEY_ID:-minioadmin}"
      S3_SECRET_KEY: "${AWS_SECRET_ACCESS_KEY:-minioadmin}"
    depends_on:
      db-migrator:
        condition: service_completed_successfully
    networks:
      - mini-lambda
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  build-worker:
    image: ghcr.io/${GITHUB_USER}/build-worker:latest
    restart: always
    group_add:
      - "984"
    environment:
      SERVICE_NAME: build-worker
      LOG_LEVEL: info
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mini_lambda}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqps://${RABBITMQ_USER}:${RABBITMQ_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT:-5671}/}
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_REGION: "${AWS_REGION:-ap-south-1}"
      S3_BUCKET: "${S3_BUCKET:-mini-lambda-prod}"
      S3_ACCESS_KEY: "${AWS_ACCESS_KEY_ID:-minioadmin}"
      S3_SECRET_KEY: "${AWS_SECRET_ACCESS_KEY:-minioadmin}"
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mini-lambda
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  lambda-service:
    image: ghcr.io/${GITHUB_USER}/lambda-service:latest
    container_name: mini-lambda-lambda-service
    restart: always
    group_add:
      - "984"
    environment:
      SERVICE_NAME: lambda-service
      LOG_LEVEL: info
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mini_lambda}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: ${RABBITMQ_URL:-amqps://${RABBITMQ_USER}:${RABBITMQ_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT:-5671}/}
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_REGION: "${AWS_REGION:-ap-south-1}"
      S3_BUCKET: "${S3_BUCKET:-mini-lambda-prod}"
      S3_ACCESS_KEY: "${AWS_ACCESS_KEY_ID:-minioadmin}"
      S3_SECRET_KEY: "${AWS_SECRET_ACCESS_KEY:-minioadmin}"
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - mini-lambda
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Observability
  prometheus:
    image: prom/prometheus:v2.47.1
    container_name: mini-lambda-prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - mini-lambda

  loki:
    image: grafana/loki:2.9.2
    container_name: mini-lambda-loki
    restart: always
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yml:ro
      - ./observability/loki/loki-rules.yml:/etc/loki/rules/fake/rules.yml:ro
      - loki-data:/loki
    networks:
      - mini-lambda

  grafana:
    image: grafana/grafana:10.1.5
    container_name: mini-lambda-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASS:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - mini-lambda
